spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/travelmind?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false

sa-token:
  # 仅用于本地开发；共享或生产环境必须通过 JWT_SECRET 覆盖。
  jwt-secret-key: ${JWT_SECRET:travelmind-dev-only-jwt-secret-change-me}
