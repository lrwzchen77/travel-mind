
spring:
  application:
    name: travelmind
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: dev
  ai:
    # DeepSeek 走 OpenAI 兼容协议（不启 starter 自动装配 ChatModel，由 AiTextService 运行时创建）
    model:
      chat: none
    openai:
      api-key: ${AI_OPENAI_API_KEY:${AI_DASHSCOPE_API_KEY:}}
      base-url: ${AI_OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_OPENAI_MODEL:deepseek-v4-flash}
  data:
    redis:
      timeout: 10s
      connect-timeout: 10s

logging:
  file:
    path: ./logs

travelmind:
  python-ai:
    base-url: ${PYTHON_AI_BASE_URL:http://localhost:19080}
    timeout-ms: ${PYTHON_AI_TIMEOUT_MS:10000}
  map:
    amap:
      enabled: ${AMAP_ENABLED:true}
      key: ${AMAP_KEY:}
      base-url: ${AMAP_BASE_URL:https://restapi.amap.com}
  content:
    xhs:
      enabled: ${XHS_ENABLED:true}
      # service: Java service 先采集小红书；tool: ReactAgent 调用小红书工具；both: 两条链路都跑并合并，适合学习对比。
      mode: ${XHS_MODE:tool}
      cookie: ${XHS_COOKIE:}
      base-url: ${XHS_BASE_URL:https://edith.xiaohongshu.com}
      # 默认使用 content 模块内置的 xhs_sign 资源；如需调试外部签名目录，可用 XHS_SIGN_DIR 覆盖为本地绝对路径。
      sign-dir: ${XHS_SIGN_DIR:classpath:xhs_sign}
      node-command: ${XHS_NODE_COMMAND:node}
      max-notes: ${XHS_MAX_NOTES:4}

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # JWT 有效期（单位：秒），必须为正数，默认 30 天。
  timeout: ${JWT_TTL_SECONDS:2592000}
  # JWT 和签名配置不得写入日志。
  is-print: false
  is-log: false

# MyBatisPlus配置
# https://baomidou.com/config/
mybatis-plus:
  # 对应的 XML 文件位置
  mapper-locations: classpath*:/mapper/**/*Mapper.xml
  # 实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: com.zkry.**.domain
  global-config:
    db-config:
      # 主键类型
      # AUTO 自增 NONE 空 INPUT 用户输入 ASSIGN_ID 雪花 ASSIGN_UUID 唯一 UUID
      # 如需改为自增 需要将数据库表全部设置为自增
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
