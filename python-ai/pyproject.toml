[project]
name = "travel-mind-python-ai"
version = "0.0.1"
description = "FastAPI service boundary for Travel Mind local AI capabilities."
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "python-dotenv>=1.0,<2.0",
  "httpx>=0.27,<1.0",
  "Pillow>=10,<12",
  "joblib>=1.4,<2.0",
  "scikit-learn>=1.6,<2.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<10.0",
  "matplotlib>=3.9,<4",
]
vision = [
  "ultralytics>=8.3,<9",
]
memory = [
  "sentence-transformers>=5.1,<6",
]
training = [
  "matplotlib>=3.9,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
